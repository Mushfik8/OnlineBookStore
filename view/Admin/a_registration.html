
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Admin Registration</title>
    <link rel="stylesheet" href="a_registration.css">
</head>

<body id="top">

    <header class="site-header">
        <h1>YOUR CHOICE</h1>
        <p class="tagline">Your Style, Your Fashion!</p>
    </header>

    <hr>

    <table class="navigation">
        <tr>
            <td><a href="../Homepage/clothingstore.html">Home</a></td>
            <td><a href="../Homepage/about.html">About Us</a></td>
            <td><a href="../Homepage/contact.html">Contact Us</a></td>
        </tr>
    </table>

    <main class="main-content">

        <section class="form-card">

            <span class="admin-tag">ADMIN PANEL</span>

            <h2>Admin Registration</h2>
            <p class="form-description">
                Create your administrator account
            </p>

            <form action="#" method="post" enctype="multipart/form-data">

                <table class="form-table">

                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td>
                            <input type="text" id="name" name="name"
                            placeholder="Enter your name" required>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="dob">Date of Birth:</label></td>
                        <td>
                            <input type="date" id="dob" name="dob" required>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="phone">Phone Number:</label></td>
                        <td>
                            <input type="tel" id="phone" name="phone"
                            placeholder="Enter your number" required>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="nid">NID Number:</label></td>
                        <td>
                            <input type="number" id="nid" name="nid"
                            placeholder="Enter your NID number" required>
                        </td>
                    </tr>

                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" id="male" name="gender"
                            value="Male" required>
                            <label for="male">Male</label>

                            <input type="radio" id="female" name="gender"
                            value="Female">
                            <label for="female">Female</label>

                            <input type="radio" id="other" name="gender"
                            value="Other">
                            <label for="other">Other</label>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="experience">Work Experience:</label>
                        </td>
                        <td>
                            <textarea id="experience" name="experience"
                            rows="3" cols="30"
                            placeholder="Describe your experience"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td>Skills:</td>
                        <td>
                            <input type="checkbox" id="management"
                            name="skills" value="Management">
                            <label for="management">Management</label>
                            <br>

                            <input type="checkbox" id="computer"
                            name="skills" value="Computer">
                            <label for="computer">Computer</label>
                            <br>

                            <input type="checkbox" id="communication"
                            name="skills" value="Communication">
                            <label for="communication">Communication</label>
                            <br>

                            <input type="checkbox" id="accounting"
                            name="skills" value="Accounting">
                            <label for="accounting">Accounting</label>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="picture">Picture:</label></td>
                        <td>
                            <input type="file" id="picture" name="picture"
                            accept="image/*" required>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password"
                            name="password" placeholder="Abcd@123" required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="confirm_password">
                                Confirm Password:
                            </label>
                        </td>
                        <td>
                            <input type="password" id="confirm_password"
                            name="confirm_password"
                            placeholder="Rewrite your password" required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="button-cell">
                            <button type="reset" class="cancel-btn">
                                Cancel
                            </button>

                            <button type="submit" class="register-btn">
                                Register Admin
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="login-link">
                            Already have an account?
                            <a href="../Login/login.html">Login</a>
                        </td>
                    </tr>

                </table>

            </form>

        </section>

    </main>

    <footer class="site-footer">

        <h3>Contact Information</h3>

        <p>Email: your_choice@gmail.com</p>
        <p>Phone: 01311317311</p>

        <hr>

        <p>Copyright &copy; 2026 YOUR CHOICE</p>

    </footer>

    <a href="#top" class="fixed-contact">↑ Back to Top</a>

</body>
</html>
