<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="c_style.css">
</head>

<body id="top">

    <header class="site-header">
        <h1>YOUR CHOICE</h1>
        <p class="tagline">Your Style, Your Fashion!</p>
    </header>

    <hr>

    <table class="navigation">
        <tr>
            <td><a href="../Homepage/clothingstore.html">Home</a></td>
            <td><a href="">About Us</a></td>
            <td><a href="">Contact Us</a></td>
        </tr>
    </table>

    <main class="main-content">

        <section class="form-card">

            <h2>Customer Registration</h2>
            <p class="form-description">
                Create your customer account
            </p>

            <form action="#" method="post">

                <table class="form-table">

                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td>
                            <input type="text" id="name" name="name"
                            placeholder="Enter your name" >
                        </td>
                    </tr>

                    <tr>
                        <td><label for="phone">Phone Number:</label></td>
                        <td>
                            <input type="tel" id="phone" name="phone"
                            placeholder="Enter your number" >
                        </td>
                    </tr>

                    <tr>
                        <td><label for="address">Address:</label></td>
                        <td>
                            <textarea id="address" name="address" rows="3"
                            placeholder="Enter your address" ></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td>
                            <input type="email" id="email" name="email"
                            placeholder="Enter your email" >
                        </td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password"
                            name="password" placeholder="Abcd@123" >
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="confirm_password">
                                Confirm Password:
                            </label>
                        </td>
                        <td>
                            <input type="password" id="confirm_password"
                            name="confirm_password"
                            placeholder="Rewrite your password" >
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="button-cell">
                            <button type="reset" class="cancel-btn">
                                Cancel
                            </button>

                            <button type="submit" class="register-btn">
                                Register
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="login-link">
                            Already have an account?
                            <a href="../Login/login.html">Login</a>
                        </td>
                    </tr>

                </table>

            </form>

        </section>

    </main>

    <footer class="site-footer">

        <h3>Contact Information</h3>

        <p>Email: mushfikurr19@gmail.com</p>
        <p>Phone: 01784915291</p>

        <hr>

    </footer>

</body>
</html>
