<!DOCTYPE html>
<html lang="en">

<head>
    <title>Her Choice - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <h1>Her Choice</h1>

    <table width="100%">
        <tr>
            <td align="center">
                <a href="../Homepage/clothingstore.html">Home</a>
            </td>

            <td align="center">
                <a href="../Homepage/about.html">About</a>
            </td>

            <td align="center">
                <a href="../Homepage/contact.html">Contact Us</a>
            </td>
        </tr>
    </table>

    <hr>

    <h2>Login</h2>

    <form>

        <table>

            <tr>
                <td>Select User Type:</td>
                <td>
                    <select name="user_type" required>
                        <option value="">Select an option</option>
                        <option value="admin">Admin</option>
                        <option value="customer">Customer</option>
                        <option value="manager">Manager</option>
                        <option value="deliverystaff">Delivery Staff</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Name:</td>
                <td>
                    <input type="text" name="name"
                    placeholder="Enter your name" required>
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" name="password"
                    placeholder="Enter your password" required>
                </td>
            </tr>

            <tr>
                <td>
                    <button type="reset">Cancel</button>
                </td>

                <td>
                    <button type="submit">Login</button>
                </td>
            </tr>

        </table>

    </form>

    <hr>

    <p>Don't have an account?</p>

    <p>
        <a href="../Customer/customer_registration.html">Register</a>
    </p>

    <hr>

    <p>Copyright &copy; 2026 Her Choice</p>

</body>

</html>
